name: CI

on:
  push:
    branches: [main, "feat/**", "setup/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check oskill/ tests/
      - name: Layer 2 discipline check - no new internal imports (ratchet)
        # oskill modules should not import each other (only __init__/_version/_base may).
        # 98 pre-existing cross-imports (incl. docstring examples) predate this check
        # being enforced; fail only if the count grows. Lower the baseline as they are removed.
        run: |
          BASELINE=98
          COUNT=$(grep -rn "from oskill\." oskill/*.py | grep -v "__init__" | grep -v "_version" | grep -v "_base" | wc -l)
          echo "cross-module oskill imports: $COUNT (baseline $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "ERROR: Layer 2 discipline violated - new oskill-internal import(s) added"
            grep -rn "from oskill\." oskill/*.py | grep -v "__init__" | grep -v "_version" | grep -v "_base"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # obase (runtime provider registry) requires Python >= 3.12.
          python-version: "3.12"
      - name: Install obase + oprim (sibling repos, not on PyPI) + oskill dev extras
        run: |
          python -m pip install --upgrade pip
          pip install "obase @ git+https://github.com/helios-plat/obase@main"
          pip install "oprim[storage,pdf] @ git+https://github.com/helios-plat/oprim@main"
          pip install -e ".[dev]"
      # Coverage floor lives in pyproject.toml ([tool.coverage.report] fail_under).
      - run: pytest -n auto --cov=oskill --cov-report=term-missing
